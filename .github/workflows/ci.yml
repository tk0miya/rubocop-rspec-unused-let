name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby-version }}

    strategy:
      matrix:
        # `required_ruby_version` is >= 2.7, but CI runs the full `rake ci`
        # against the committed Gemfile.lock, whose pinned dev dependencies
        # (e.g. steep/rbs and parallel) require Ruby >= 3.3.
        ruby-version: ["3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run CI
        run: bundle exec rake ci
